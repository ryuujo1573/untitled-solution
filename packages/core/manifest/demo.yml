name: Entity Repository

entities:
  Contact:
    properties:
      - { name: firstName, type: string }
      - { name: lastName, type: string, validation: { maxLength: 50 } }
      - { name: email, type: email, validation: { required: true } }
      - { name: message, type: text }
    policies:
      create:
        - access: public
    middlewares:
      beforeCreate:
        - handler: sendEmail
